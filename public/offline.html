<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0D1730">
  <title>أنت دون اتصال | المكتب التنفيذي</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;color:#151a25;background:#f7f5f0;font-family:Tahoma,Arial,sans-serif}.card{width:min(430px,100%);padding:36px 24px;text-align:center;border:1px solid #e2e4ea;border-radius:20px;background:#fff;box-shadow:0 18px 48px rgba(13,23,48,.12)}.mark{width:76px;height:76px;display:grid;place-items:center;margin:0 auto 20px;border-radius:22px;color:#f1dfb2;background:#0d1730;font-size:34px;font-weight:700}.line{width:52px;height:4px;margin:0 auto 22px;border-radius:4px;background:#b69a62}h1{margin:0 0 8px;color:#0d1730;font-size:27px}p{margin:0 0 24px;color:#6e7480;line-height:1.8}button{min-height:48px;padding:0 22px;color:#fff;border:0;border-radius:10px;background:#4b18b8;font:700 15px inherit;cursor:pointer}
  </style>
</head>
<body><main class="card"><div class="mark">م</div><div class="line"></div><h1>الاتصال غير متاح حالياً</h1><p>يمكنك متابعة الصفحات التي تم فتحها مسبقاً. تحقق من الشبكة ثم أعد المحاولة.</p><button onclick="location.reload()">إعادة المحاولة</button></main></body>
</html>
